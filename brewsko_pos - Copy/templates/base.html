<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Brewsko Bistro POS{% endblock %}</title>
{% load static %}
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brewsko: {
            50: '#FFF8F1',
            100: '#FCE8D1',
            200: '#F6CAA8',
            300: '#EDA579',
            400: '#E87A46',
            500: '#DC5F2D',
            600: '#B94B24',
            700: '#893C1D',
            800: '#6B3018',
            900: '#4E2413'
          },
          warmgray: {
            50: '#F5E6D0',
            100: '#E8D4B8',
            200: '#D4C2A0',
            300: '#C8A882',
            400: '#B89670',
            500: '#A38456',
            600: '#8A6040',
            700: '#7A4020',
            800: '#5A2E0E',
            900: '#4A2010',
            950: '#3D1A08'
          },
          brown: {
            950: '#2C1203',
            900: '#3D1A08',
            800: '#4A2010',
            700: '#5A2E0E',
            600: '#7A4020',
            500: '#8A6040',
            400: '#A38456',
            300: '#B89670',
            200: '#D4C2A0',
            100: '#E8D4B8',
            50: '#F5E6D0'
          }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
{% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-brown-950 text-warmgray-50 font-['Raleway',sans-serif]">
<div id="toastContainer" class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none px-4 py-4">
  {% if messages %}
    <div class="space-y-3 w-full max-w-md">
      {% for message in messages %}
        <div class="toast-message rounded-3xl border px-4 py-3 text-sm shadow-xl shadow-black/20 pointer-events-auto transition-all duration-500 ease-out {% if message.tags == 'error' %}border-red-500/40 bg-red-500/10 text-red-100{% else %}border-brewsko-500/40 bg-brewsko-500/10 text-warmgray-50{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
{% block body %}{% endblock %}
<script src="{% static 'js/main.js' %}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
