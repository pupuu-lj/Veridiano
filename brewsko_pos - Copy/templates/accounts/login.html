{% extends 'base.html' %}
{% load static %}
{% block title %}POS System Login - Brewsko Bistro{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4 py-10 bg-brown-950">
  <div class="w-full max-w-md rounded-3xl border-2 border-brewsko-500 bg-brown-900/95 p-10 shadow-2xl shadow-black/40 backdrop-blur-sm">
    <div class="text-center mb-8">
      <div class="mx-auto flex h-24 w-24 items-center justify-center rounded-full border border-brewsko-600 bg-brown-800 text-3xl font-black text-brewsko-400">
        BB
      </div>
      <p class="mt-6 text-sm uppercase tracking-[0.32em] text-warmgray-400">Sizzling · Coffee · Restaurant</p>
    </div>
    <div class="space-y-4">
      <h2 class="text-3xl font-semibold text-warmgray-50">POS System Login</h2>
      {% if messages %}
        <div class="space-y-2">
          {% for msg in messages %}
            <div class="rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-200">{{ msg }}</div>
          {% endfor %}
        </div>
      {% endif %}
      <form method="post" class="space-y-5">
        {% csrf_token %}
        <label class="block space-y-2 text-sm text-warmgray-200">
          <span class="font-medium">Username</span>
          <input type="text" name="username" placeholder="Enter username" required class="w-full rounded-2xl border border-brown-700 bg-brown-950 px-4 py-3 text-warmgray-50 outline-none transition focus:border-brewsko-400 focus:ring-2 focus:ring-brewsko-500/20" />
        </label>
        <label class="block space-y-2 text-sm text-warmgray-200">
          <span class="font-medium">Password</span>
          <input type="password" name="password" placeholder="Enter password" required class="w-full rounded-2xl border border-brown-700 bg-brown-950 px-4 py-3 text-warmgray-50 outline-none transition focus:border-brewsko-400 focus:ring-2 focus:ring-brewsko-500/20" />
        </label>
        <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-brewsko-500 px-4 py-3 text-base font-semibold text-white transition hover:bg-brewsko-400">Login</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
